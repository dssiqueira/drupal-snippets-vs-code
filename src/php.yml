        return \$build;
      }

    }

- name: Form
  prefix: drupal_form
  kind: file
  description: Form extending FormBase (src/Form).
  body: |
    <?php

    declare(strict_types=1);

    namespace Drupal\\@@MODULE:1@@\Form;

    use Drupal\Core\Form\FormBase;
    use Drupal\Core\Form\FormStateInterface;

    /**
     * Provides a ${3:Example} form.
     */
    final class @@CLASS:2@@ extends FormBase {

      /**
       * {@inheritdoc}
       */
      public function getFormId(): string {
        return '${1}_${4:example}';
      }

      /**
       * {@inheritdoc}
       */
      public function buildForm(array \$form, FormStateInterface \$form_state): array {
        \$form['${5:message}'] = [
          '#type' => '${6|textfield,textarea,email,number,select,checkbox|}',
          '#title' => \$this->t('${7:Message}'),
          '#required' => TRUE,
        ];

        \$form['actions'] = [
          '#type' => 'actions',
          'submit' => [
            '#type' => 'submit',
            '#value' => \$this->t('${8:Submit}'),
          ],
        ];

        return \$form;
      }

      /**
       * {@inheritdoc}
       */
      public function validateForm(array &\$form, FormStateInterface \$form_state): void {
        $0
      }

      /**
       * {@inheritdoc}
       */
      public function submitForm(array &\$form, FormStateInterface \$form_state): void {
        \$this->messenger()->addStatus(\$this->t('The form has been submitted.'));
        \$form_state->setRedirect('<front>');
      }

    }

- name: Config form
  prefix: drupal_config_form
  kind: file
  description: 'Settings form extending ConfigFormBase with #config_target (Drupal 10.2+). Needs a config schema (drupal_config_schema).'
  body: |
    <?php

    declare(strict_types=1);

    namespace Drupal\\@@MODULE:1@@\Form;

    use Drupal\Core\Form\ConfigFormBase;
    use Drupal\Core\Form\FormStateInterface;

    /**
     * Configure ${1} settings for this site.
     */
    final class @@CLASS:2@@ extends ConfigFormBase {

      /**
       * {@inheritdoc}
       */
      public function getFormId(): string {
        return '${1}_settings';
      }

      /**
       * {@inheritdoc}
       */
      protected function getEditableConfigNames(): array {
        return ['${1}.settings'];
      }

      /**
       * {@inheritdoc}
       */
      public function buildForm(array \$form, FormStateInterface \$form_state): array {
        \$form['${3:example}'] = [
          '#type' => '${4|textfield,textarea,checkbox,number,email|}',
          '#title' => \$this->t('${5:Example}'),
          '#config_target' => '${1}.settings:${3}',
        ];
        $0
        return parent::buildForm(\$form, \$form_state);
      }

    }

