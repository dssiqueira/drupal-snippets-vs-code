- name: Field formatter
  prefix: drupal_field_formatter
  kind: file
  description: 'Field formatter plugin with the #[FieldFormatter] attribute (Drupal 10.3+, src/Plugin/Field/FieldFormatter).'
  body: |
    <?php

    declare(strict_types=1);

    namespace Drupal\\@@MODULE:1@@\Plugin\Field\FieldFormatter;

    use Drupal\Core\Field\Attribute\FieldFormatter;
    use Drupal\Core\Field\FieldItemListInterface;
    use Drupal\Core\Field\FormatterBase;
    use Drupal\Core\StringTranslation\TranslatableMarkup;

    /**
     * Plugin implementation of the '${1}_${3:example}' formatter.
     */
    #[FieldFormatter(
      id: '${1}_${3}',
      label: new TranslatableMarkup('${4:Example}'),
      field_types: ['${5:string}'],
    )]
    final class @@CLASS:2@@ extends FormatterBase {

      /**
       * {@inheritdoc}
       */
      public function viewElements(FieldItemListInterface \$items, \$langcode): array {
        \$element = [];
        foreach (\$items as \$delta => \$item) {
          \$element[\$delta] = [
            '#markup' => \$item->value,
          ];
        }
        return \$element;
      }

    }

