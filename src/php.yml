# Hand-written PHP snippets. Built into snippets/php.json by scripts/build.mjs.
# kind tells the validator how to lint the expanded code:
#   file = whole PHP file, member = inside a class, statement, expression,
#   array_item = an element inside a PHP array.

# --- Classes and plugins ----------------------------------------------------

- name: Hook class
  prefix: drupal_hooks_class
  kind: file
  description: Class for OOP hooks in src/Hook (Drupal 11.1+). Add methods with the hook_*_oop snippets.
  body: |
    <?php

    declare(strict_types=1);

    namespace Drupal\\@@MODULE:1@@\Hook;

    use Drupal\Core\Hook\Attribute\Hook;

    /**
     * Hook implementations for ${1}.
     */
    final class @@CLASS:2@@ {

      $0

    }

- name: Controller
  prefix: drupal_controller
  kind: file
  description: Controller extending ControllerBase (src/Controller).
  body: |
    <?php

    declare(strict_types=1);

    namespace Drupal\\@@MODULE:1@@\Controller;

    use Drupal\Core\Controller\ControllerBase;

    /**
     * Returns responses for ${3:Example} routes.
     */
    final class @@CLASS:2@@ extends ControllerBase {

      /**
       * Builds the response.
       */
