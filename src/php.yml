# --- Dependency injection -----------------------------------------------------

- name: Dependency injection (create)
  prefix: drupal_create
  kind: member
  description: Constructor + create() for controllers and forms (ContainerInjectionInterface).
  body: |
    public function __construct(
      private readonly ${1:EntityTypeManagerInterface} \$${2:entityTypeManager},
    ) {}

    /**
     * {@inheritdoc}
     */
    public static function create(ContainerInterface \$container): static {
      return new static(
        \$container->get('${3:entity_type.manager}'),
      );
    }

- name: Dependency injection for plugins (create)
  prefix: drupal_plugin_create
  kind: member
  description: Constructor + create() for plugins (ContainerFactoryPluginInterface).
  body: |
    public function __construct(
      array \$configuration,
      \$plugin_id,
      \$plugin_definition,
      private readonly ${1:EntityTypeManagerInterface} \$${2:entityTypeManager},
    ) {
      parent::__construct(\$configuration, \$plugin_id, \$plugin_definition);
    }

    /**
     * {@inheritdoc}
     */
    public static function create(ContainerInterface \$container, array \$configuration, \$plugin_id, \$plugin_definition): static {
      return new static(
        \$configuration,
        \$plugin_id,
        \$plugin_definition,
        \$container->get('${3:entity_type.manager}'),
      );
    }

# --- Everyday code -------------------------------------------------------------

- name: Load entity
  prefix: drupal_entity_load
  kind: expression
  description: Load an entity by ID.
  body: |
    \Drupal::entityTypeManager()->getStorage('${1:node}')->load(${2:\$id})

- name: Load multiple entities by properties
  prefix: drupal_entity_load_by_properties
  kind: expression
  description: Load entities matching property values.
  body: |
    \Drupal::entityTypeManager()->getStorage('${1:node}')->loadByProperties([
      '${2:type}' => '${3:article}',
      '${4:status}' => ${5:1},
    ])

- name: Entity query
  prefix: drupal_entity_query
  kind: expression
  description: Entity query (accessCheck() is mandatory since Drupal 10).
  body: |
    \Drupal::entityTypeManager()->getStorage('${1:node}')->getQuery()
      ->accessCheck(${2|TRUE,FALSE|})
      ->condition('${3:type}', '${4:article}')
      ->sort('${5:created}', '${6|DESC,ASC|}')
      ->range(0, ${7:10})
      ->execute()

- name: Logger
  prefix: drupal_logger
  kind: statement
  description: Log a message to the module channel.
  body: |
    \Drupal::logger('@@MODULE_FILE:1@@')->${2|notice,info,warning,error,debug|}('${3:Message @placeholder}', ['@placeholder' => ${4:\$value}]);

- name: Messenger
  prefix: drupal_messenger
  kind: statement
  description: Show a message to the user.
  body: |
    \Drupal::messenger()->${1|addStatus,addWarning,addError|}(t('${2:Message}'));

- name: Read config
  prefix: drupal_config_get
  kind: expression
  description: Read a value from simple configuration.
  body: |
    \Drupal::config('@@MODULE_FILE:1@@.settings')->get('${2:key}')

- name: Write config
  prefix: drupal_config_set
  kind: statement
  description: Write a value to simple configuration.
  body: |
    \Drupal::configFactory()->getEditable('@@MODULE_FILE:1@@.settings')
      ->set('${2:key}', ${3:\$value})
      ->save();

- name: Url from route
  prefix: drupal_url
  kind: expression
  description: Build a Url object from a route.
  body: |
    \Drupal\Core\Url::fromRoute('${1:entity.node.canonical}', [${2:'node' => \$nid}])

- name: Link from route
  prefix: drupal_link
  kind: expression
  description: Build a Link object from a route.
  body: |
    \Drupal\Core\Link::createFromRoute(t('${1:Link text}'), '${2:<front>}')

- name: Render array (theme)
  prefix: drupal_render_theme
  kind: expression
  description: Render array using a theme hook, with cache metadata.
  body: |
    [
      '#theme' => '${1:item_list}',
      '#${2:items}' => ${3:\$items},
      '#cache' => [
        'tags' => [${4:'node_list'}],
        'contexts' => [${5:'url.path'}],
      ],
    ]

- name: Cache metadata
  prefix: drupal_cache_metadata
  kind: array_item
  description: '#cache key for a render array.'
  body: |
    '#cache' => [
      'contexts' => [${1:'user.permissions'}],
      'tags' => [${2:'node_list'}],
      'max-age' => ${3:\Drupal\Core\Cache\Cache::PERMANENT},
    ],

- name: Cache get/set
  prefix: drupal_cache
  kind: statement
  description: Read from the cache, computing and storing the value on a miss.
  body: |
    \$cid = '${1:mymodule:key}';
    if (\$cache = \Drupal::cache()->get(\$cid)) {
      \$data = \$cache->data;
    }
    else {
      \$data = ${2:\$this->compute()};
      \Drupal::cache()->set(\$cid, \$data, \Drupal\Core\Cache\CacheBackendInterface::CACHE_PERMANENT, [${3:'node_list'}]);
    }

- name: Batch
  prefix: drupal_batch
  kind: statement
  description: Start a batch with BatchBuilder.
  body: |
    \$batch = (new \Drupal\Core\Batch\BatchBuilder())
      ->setTitle(t('${1:Processing}'))
      ->setFinishCallback([${2:static::class}, '${3:batchFinished}'])
      ->addOperation([${2}, '${4:batchProcess}'], [${5:\$items}]);
    batch_set(\$batch->toArray());

- name: Access result
  prefix: drupal_access_result
  kind: statement
  description: Return an AccessResult based on a permission.
  body: |
    return \Drupal\Core\Access\AccessResult::allowedIfHasPermission(\$${1:account}, '${2:access content}');
